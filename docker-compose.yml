# Local, self-contained stack (unverified: Docker is not installed on the
# development machine). This runs the development identity issuer, NOT Supabase
# Auth. For the real identity path use the hosted project or `supabase start`
# (see docs/deployment.md).
#
#   $env:LOCAL_JWT_SECRET = "<random value>"
#   docker compose up --build
#
#   API   http://localhost:8000
#   Web   http://localhost:5173
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentops}
      POSTGRES_DB: agentops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment:
      ENVIRONMENT: development
      AUTH_MODE: local
      DATABASE_URL: postgresql+psycopg://agentops:${POSTGRES_PASSWORD:-agentops}@postgres:5432/agentops
      TEST_DATABASE_URL: postgresql+psycopg://agentops:${POSTGRES_PASSWORD:-agentops}@postgres:5432/agentops
      # libpq DSN for psql (it does not understand the SQLAlchemy "+psycopg" suffix).
      MIGRATION_DATABASE_URL: postgresql://agentops:${POSTGRES_PASSWORD:-agentops}@postgres:5432/agentops
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:?set LOCAL_JWT_SECRET (development only)}
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      # Schema authority, mounted read-only so the command applies the same SQL
      # files used in development, tests and hosted deployments.
      - ./supabase/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "for f in /migrations/*.sql; do psql \"$$MIGRATION_DATABASE_URL\" -v ON_ERROR_STOP=1 -f \"$$f\"; done &&
             python -m app"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:

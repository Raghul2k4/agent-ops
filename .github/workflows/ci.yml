name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops
          POSTGRES_DB: agentops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install PostgreSQL client
        # The test harness applies supabase/migrations/*.sql with psql, exactly as
        # it does on a developer machine. It skips (never silently passes) if psql
        # is missing, so CI installs it explicitly.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Test suite
        env:
          ENVIRONMENT: test
          AUTH_MODE: local
          LOCAL_JWT_SECRET: ci-only-development-issuer-secret-not-a-deployment-secret
          TEST_DATABASE_URL: postgresql+psycopg://agentops:agentops@127.0.0.1:5432/agentops_test
        # Includes unit, integration and the RLS policy assertions
        # (supabase/tests/rls_policies.sql). No hosted project is contacted.
        run: python -m pytest tests -q

  web:
    name: Web (lint, types, build, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config
        env:
          LOCAL_JWT_SECRET: ci-only-development-issuer-secret-not-a-deployment-secret

      - name: Build images
        run: docker compose build
        env:
          # The self-contained stack uses the development issuer only.
          LOCAL_JWT_SECRET: ci-only-development-issuer-secret-not-a-deployment-secret
